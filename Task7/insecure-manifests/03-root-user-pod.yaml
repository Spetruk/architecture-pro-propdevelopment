apiVersion: v1
kind: Pod
metadata:
  name: pod-root-user
  namespace: audit-zone
  labels:
    app: insecure-root
spec:
  containers:
    - name: nginx
      image: nginx:1.21
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: true
      ports:
        - containerPort: 80